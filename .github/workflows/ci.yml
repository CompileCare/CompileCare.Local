name: Local tooling validation
on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: heapcare-local-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate macOS shell script
        run: bash -n local/scripts/start-macos.sh
      - name: Validate local stack smoke script
        run: bash -n local/scripts/verify-stack.sh
      - name: Validate Windows PowerShell script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("local/scripts/start-windows.ps1", [ref]$tokens, [ref]$errors) > $null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          $launcher = Get-Content "local/scripts/start-windows.ps1" -Raw
          if ($launcher -notmatch 'docker-compose\.observability\.yml') { throw "Windows launcher must include the observability Compose overlay." }
          if ($launcher -notmatch 'provision-kibana-data-view\.py') { throw "Windows launcher must provision the Kibana data view." }
          if ($launcher -notmatch 'pg_isready') { throw "Windows launcher must verify PostgreSQL readiness." }
          $stop = Get-Content "local/Stop HeapCare.bat" -Raw
          if ($stop -notmatch 'docker-compose\.observability\.yml') { throw "Windows stop launcher must stop the observability overlay." }
      - name: Validate local secret placeholders fail closed
        run: |
          python - <<'PY'
          from pathlib import Path
          env = Path("local/.env.example").read_text(encoding="utf-8")
          compose = Path("local/docker-compose.yml").read_text(encoding="utf-8")
          assert "KEYCLOAK_ADMIN_PASSWORD=replace-with-a-random-local-secret" in env
          assert "POSTGRES_PASSWORD=replace-with-a-random-local-secret" in env
          assert "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in local/.env}" in compose
          assert "POSTGRES_PASSWORD:-compilecare-local-only" not in compose
          assert "Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in local/.env}" in compose
          assert "CSP_CONNECT_SRC=http://localhost:8081 http://keycloak.localhost:8082" in env
          assert "CSP_FRAME_SRC=http://keycloak.localhost:8082" in env
          assert "ALLOW_INSECURE_CSP_ORIGINS=true" in env
          assert "CSP_CONNECT_SRC: ${CSP_CONNECT_SRC:-http://localhost:8081 http://keycloak.localhost:8082}" in compose
          assert "CSP_FRAME_SRC: ${CSP_FRAME_SRC:-http://keycloak.localhost:8082}" in compose
          assert 'ALLOW_INSECURE_CSP_ORIGINS: "true"' in compose
          mac = Path("local/scripts/start-macos.sh").read_text(encoding="utf-8")
          windows = Path("local/scripts/start-windows.ps1").read_text(encoding="utf-8")
          assert 'NEW_LOCAL_ENV=true' in mac and '"$NEW_LOCAL_ENV" == "true"' in mac
          assert '$NewLocalEnv = $true' in windows and '$NewLocalEnv -and' in windows
          print("Local secrets use explicit placeholders and Compose refuses password fallbacks.")
          PY
      - name: Validate Keycloak realm import
        run: |
          python -m py_compile local/scripts/configure-keycloak.py local/scripts/provision-kibana-data-view.py local/scripts/verify-authenticated-tenancy.py
          python -m json.tool local/keycloak/compilecare-realm.json > /dev/null
          python - <<'PY'
          import json
          with open("local/keycloak/compilecare-realm.json", encoding="utf-8") as file:
              realm = json.load(file)
          assert realm["realm"] == "compilecare"
          client = next(item for item in realm["clients"] if item["clientId"] == "compilecare-web")
          assert client["publicClient"] is True
          assert client["attributes"]["pkce.code.challenge.method"] == "S256"
          scope = next(item for item in realm["clientScopes"] if item["name"] == "compilecare-api-audience")
          mapper = next(item for item in scope["protocolMappers"] if item["protocolMapper"] == "oidc-audience-mapper")
          assert mapper["config"]["included.custom.audience"] == "compilecare-api"
          assert mapper["config"]["access.token.claim"] == "true"
          assert mapper["config"]["id.token.claim"] == "false"
          assert "basic" in client["defaultClientScopes"]
          assert "compilecare-api-audience" in client["defaultClientScopes"]
          assert "profile" in client["defaultClientScopes"]
          assert "email" in client["defaultClientScopes"]
          profile = next(item for item in realm["clientScopes"] if item["name"] == "profile")
          email = next(item for item in realm["clientScopes"] if item["name"] == "email")
          assert any(mapper["config"].get("claim.name") == "given_name" for mapper in profile["protocolMappers"])
          assert any(mapper["config"].get("claim.name") == "email" for mapper in email["protocolMappers"])
          custom_scope_names = {scope["name"] for scope in realm["clientScopes"]}
          assert all(name in custom_scope_names or name == "basic" for name in client["defaultClientScopes"])
          PY
      - name: Smoke-test Keycloak realm import in Docker
        run: |
          docker run -d --name heapcare-keycloak-ci \
            -p 127.0.0.1:8082:8082 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=LocalOnly-CI-Password-123! \
            -e KC_HTTP_ENABLED=true \
            -e KC_HOSTNAME=http://keycloak.localhost:8082 \
            -e KC_HOSTNAME_STRICT=true \
            -e KC_HOSTNAME_STRICT_HTTPS=false \
            -e KC_HEALTH_ENABLED=true \
            -v "$GITHUB_WORKSPACE/local/keycloak/compilecare-realm.json:/opt/keycloak/data/import/compilecare-realm.json:ro" \
            quay.io/keycloak/keycloak:26.2.5 start-dev --http-port=8082 --import-realm
          ready=false
          for attempt in $(seq 1 90); do
            if curl --silent --show-error --fail --resolve keycloak.localhost:8082:127.0.0.1 \
              http://keycloak.localhost:8082/realms/compilecare/.well-known/openid-configuration \
              -o "$RUNNER_TEMP/heapcare-oidc.json"; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            docker logs heapcare-keycloak-ci
            exit 1
          fi
          python - <<'PY'
          import json
          with open(__import__("os").path.join(__import__("os").environ["RUNNER_TEMP"], "heapcare-oidc.json"), encoding="utf-8") as file:
              discovery = json.load(file)
          assert discovery["issuer"] == "http://keycloak.localhost:8082/realms/compilecare", discovery["issuer"]
          assert discovery["authorization_endpoint"].endswith("/protocol/openid-connect/auth")
          assert discovery["jwks_uri"].endswith("/protocol/openid-connect/certs")
          print("Keycloak realm import and OIDC discovery verified.")
          PY
          echo "127.0.0.1 keycloak.localhost" | sudo tee -a /etc/hosts > /dev/null
          KEYCLOAK_ADMIN_PASSWORD=LocalOnly-CI-Password-123! python3 local/scripts/configure-keycloak.py local/.env.example --base-url http://keycloak.localhost:8082

          admin_token="$(curl --silent --show-error --fail --resolve keycloak.localhost:8082:127.0.0.1 \
            -d grant_type=password -d client_id=admin-cli \
            -d username=admin -d password=LocalOnly-CI-Password-123! \
            http://keycloak.localhost:8082/realms/master/protocol/openid-connect/token | jq -r .access_token)"
          export KEYCLOAK_ADMIN_TOKEN="$admin_token"
          # Simulate an already-initialized Keycloak volume with stale redirect URIs.
          curl --silent --show-error --fail --resolve keycloak.localhost:8082:127.0.0.1 \
            -H "Authorization: Bearer $admin_token" \
            "http://keycloak.localhost:8082/admin/realms/compilecare/clients?clientId=compilecare-web" \
            -o "$RUNNER_TEMP/heapcare-web-client-before-reconcile.json"
          client_id="$(jq -r '.[0].id' "$RUNNER_TEMP/heapcare-web-client-before-reconcile.json")"
          jq '.[0] | .redirectUris = (.redirectUris | map(select(. != "http://localhost:8080/auth/silent-callback")))' \
            "$RUNNER_TEMP/heapcare-web-client-before-reconcile.json" > "$RUNNER_TEMP/heapcare-web-client-stale.json"
          curl --silent --show-error --fail --resolve keycloak.localhost:8082:127.0.0.1 \
            -X PUT -H "Authorization: Bearer $admin_token" -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/heapcare-web-client-stale.json" \
            "http://keycloak.localhost:8082/admin/realms/compilecare/clients/$client_id"

          KEYCLOAK_ADMIN_PASSWORD=LocalOnly-CI-Password-123! python3 local/scripts/configure-keycloak.py local/.env.example --base-url http://keycloak.localhost:8082
          curl --silent --show-error --fail --resolve keycloak.localhost:8082:127.0.0.1 \
            -H "Authorization: Bearer $admin_token" \
            "http://keycloak.localhost:8082/admin/realms/compilecare/clients?clientId=compilecare-web" \
            -o "$RUNNER_TEMP/heapcare-web-client-after-reconcile.json"
          python - <<'PY'
          import json, os
          with open(os.path.join(os.environ["RUNNER_TEMP"], "heapcare-web-client-after-reconcile.json"), encoding="utf-8") as file:
              clients = json.load(file)
          assert len(clients) == 1, clients
          redirect_uris = set(clients[0].get("redirectUris", []))
          assert "http://localhost:8080/auth/callback" in redirect_uris, redirect_uris
          assert "http://localhost:8080/auth/silent-callback" in redirect_uris, redirect_uris
          print("Existing Keycloak client redirect URIs reconciled without resetting the realm.")
          PY

          curl --silent --show-error --fail --resolve keycloak.localhost:8082:127.0.0.1 \
            -H "Authorization: Bearer $admin_token" \
            http://keycloak.localhost:8082/admin/realms/compilecare/client-scopes \
            -o "$RUNNER_TEMP/heapcare-client-scopes.json"
          curl --silent --show-error --fail --resolve keycloak.localhost:8082:127.0.0.1 \
            -H "Authorization: Bearer $admin_token" \
            "http://keycloak.localhost:8082/admin/realms/compilecare/clients?clientId=compilecare-web" \
            -o "$RUNNER_TEMP/heapcare-web-client.json"
          python - <<'PY'
          import json, os
          root = os.environ["RUNNER_TEMP"]
          with open(os.path.join(root, "heapcare-client-scopes.json"), encoding="utf-8") as f:
              scopes = {item["name"]: item for item in json.load(f)}
          assert "profile" in scopes and "email" in scopes and "compilecare-api-audience" in scopes
          profile_claims = {m.get("config", {}).get("claim.name") for m in scopes["profile"].get("protocolMappers", [])}
          email_claims = {m.get("config", {}).get("claim.name") for m in scopes["email"].get("protocolMappers", [])}
          assert "given_name" in profile_claims and "family_name" in profile_claims
          assert "email" in email_claims
          with open(os.path.join(root, "heapcare-web-client.json"), encoding="utf-8") as f:
              clients = json.load(f)
          assert len(clients) == 1, clients
          client_id = clients[0]["id"]
          import subprocess
          defaults = subprocess.check_output([
              "curl", "--silent", "--show-error", "--fail",
              "--resolve", "keycloak.localhost:8082:127.0.0.1",
              "-H", "Authorization: Bearer " + os.environ["KEYCLOAK_ADMIN_TOKEN"],
              f"http://keycloak.localhost:8082/admin/realms/compilecare/clients/{client_id}/default-client-scopes"
          ], text=True)
          default_names = {item["name"] for item in json.loads(defaults)}
          assert {"basic", "profile", "email", "compilecare-api-audience"}.issubset(default_names), default_names
          print("Keycloak profile/email claims and default API audience scope verified.")
          PY
          docker rm -f heapcare-keycloak-ci
      - name: Validate OpenTelemetry Collector configuration
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/local/observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro" \
            otel/opentelemetry-collector:0.165.0 \
            validate --config=/etc/otel-collector-config.yaml
      - name: Validate Docker Compose configuration
        run: |
          mkdir -p local/.secrets "$RUNNER_TEMP/HeapCare.Web"
          printf 'Username=ci;Password=placeholder;ValidAuthenticationTypes=Basic' > local/.secrets/nuget-source-credentials
          HEAPCARE_API_PATH="$GITHUB_WORKSPACE" HEAPCARE_WEB_PATH="$RUNNER_TEMP/HeapCare.Web" docker compose --env-file local/.env.example -f local/docker-compose.yml config --quiet
          HEAPCARE_API_PATH="$GITHUB_WORKSPACE" HEAPCARE_WEB_PATH="$RUNNER_TEMP/HeapCare.Web" docker compose --env-file local/.env.example -f local/docker-compose.yml -f local/docker-compose.observability.yml config --quiet
          rm -rf local/.secrets
      - name: Run Docker observability pipeline smoke test
        run: |
          set -euo pipefail
          mkdir -p local/.secrets "$RUNNER_TEMP/HeapCare.Web"
          printf 'Username=ci;Password=placeholder;ValidAuthenticationTypes=Basic' > local/.secrets/nuget-source-credentials
          export HEAPCARE_API_PATH="$GITHUB_WORKSPACE"
          export HEAPCARE_WEB_PATH="$RUNNER_TEMP/HeapCare.Web"
          compose=(--project-name heapcare-observability-ci --env-file local/.env.example -f local/docker-compose.yml -f local/docker-compose.observability.yml)
          cleanup() {
            docker compose "${compose[@]}" down --volumes --remove-orphans || true
            rm -rf local/.secrets
          }
          trap cleanup EXIT

          # Start only the observability services; the API image is not needed for this backend pipeline smoke.
          docker compose "${compose[@]}" up -d otel-collector jaeger prometheus elasticsearch kibana

          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          def request(url, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              headers = {"Accept": "application/json"}
              if data is not None:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=5) as response:
                  body = response.read()
                  return json.loads(body) if body and "json" in response.headers.get("Content-Type", "") else body

          def wait_for(url, label, attempts=90):
              last = None
              for _ in range(attempts):
                  try:
                      request(url)
                      print(f"{label} is ready")
                      return
                  except Exception as error:
                      last = error
                      time.sleep(2)
              raise RuntimeError(f"{label} did not become ready: {last}")

          wait_for("http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s", "Elasticsearch")
          wait_for("http://localhost:5601/api/status", "Kibana")
          import subprocess, sys
          subprocess.run(
              [sys.executable, "local/scripts/provision-kibana-data-view.py", "--base-url", "http://localhost:5601"],
              check=True,
          )
          data_views = request("http://localhost:5601/api/data_views")
          assert any(
              view.get("title") == "heapcare-logs-*"
              for view in data_views.get("data_view", [])
          ), "HeapCare Logs Kibana data view was not provisioned"
          wait_for("http://localhost:9090/-/ready", "Prometheus")
          wait_for("http://localhost:16686/", "Jaeger")
          wait_for("http://localhost:8889/metrics", "OpenTelemetry Collector Prometheus exporter")

          now = time.time_ns()
          start = str(now - 1_000_000_000)
          end = str(now)
          trace_id = "0102030405060708090a0b0c0d0e0f10"
          span_id = "0102030405060708"

          metrics_payload = {
              "resourceMetrics": [{
                  "resource": {"attributes": [
                      {"key": "service.name", "value": {"stringValue": "HeapCare.Api.CI"}}
                  ]},
                  "scopeMetrics": [{
                      "scope": {"name": "heapcare-ci-smoke"},
                      "metrics": [{
                          "name": "heapcare_ci_smoke_total",
                          "sum": {
                              "dataPoints": [{
                                  "attributes": [{"key": "scenario", "value": {"stringValue": "docker-overlay"}}],
                                  "startTimeUnixNano": start,
                                  "timeUnixNano": end,
                                  "asInt": "1"
                              }],
                              "aggregationTemporality": 2,
                              "isMonotonic": True
                          }
                      }]
                  }]
              }]
          }
          request("http://localhost:4318/v1/metrics", "POST", metrics_payload)

          traces_payload = {
              "resourceSpans": [{
                  "resource": {"attributes": [
                      {"key": "service.name", "value": {"stringValue": "HeapCare.Api.CI"}}
                  ]},
                  "scopeSpans": [{
                      "scope": {"name": "heapcare-ci-smoke"},
                      "spans": [{
                          "traceId": trace_id,
                          "spanId": span_id,
                          "name": "heapcare-observability-ci-smoke",
                          "kind": 1,
                          "startTimeUnixNano": start,
                          "endTimeUnixNano": end,
                          "status": {"code": 1}
                      }]
                  }]
              }]
          }
          request("http://localhost:4318/v1/traces", "POST", traces_payload)

          log_payload = {
              "@timestamp": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "service": "HeapCare.Api.CI",
              "message": "Synthetic HeapCare observability pipeline smoke",
              "correlation_id": "ci-observability-smoke"
          }
          request("http://localhost:9200/heapcare-logs-ci-smoke/_doc", "POST", log_payload)

          # Wait for the collector scrape and verify the sample metric is queryable.
          metric_query = urllib.parse.quote("heapcare_ci_smoke_total")
          metric_result = None
          for _ in range(30):
              try:
                  result = request(f"http://localhost:9090/api/v1/query?query={metric_query}")
                  if result.get("data", {}).get("result"):
                      metric_result = result
                      break
              except Exception:
                  pass
              time.sleep(2)
          assert metric_result is not None, "Synthetic OTLP metric was not queryable in Prometheus"

          # Verify that the synthetic trace reached Jaeger.
          trace_result = None
          for _ in range(30):
              try:
                  result = request(f"http://localhost:16686/api/v3/traces/{trace_id}")
                  trace_payload = result.get("result", {})
                  if trace_payload.get("resourceSpans"):
                      trace_result = trace_payload
                      break
              except Exception:
                  pass
              time.sleep(2)
          assert trace_result is not None, "Synthetic OTLP trace was not queryable in Jaeger's v3 trace API"

          # Verify Elasticsearch accepted and can return a synthetic log record.
          log_result = request("http://localhost:9200/heapcare-logs-ci-smoke/_search?q=correlation_id:ci-observability-smoke")
          assert log_result.get("hits", {}).get("total", {}).get("value", 0) > 0, "Synthetic log record was not queryable in Elasticsearch"

          print("Verified OTLP metrics -> Prometheus, OTLP traces -> Jaeger, and synthetic logs -> Elasticsearch; Kibana and all backends are ready.")
          PY

  full-stack-verify:
    name: Full nine-service Docker stack and API telemetry verification
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: HeapCare.Local

      - uses: actions/checkout@v4
        with:
          repository: HeapCare/HeapCare.Api
          ref: main
          path: HeapCare.Api

      - uses: actions/checkout@v4
        with:
          repository: HeapCare/HeapCare.Web
          ref: main
          path: HeapCare.Web

      - uses: actions/checkout@v4
        with:
          repository: HeapCare/HeapCare.Observability
          ref: main
          path: HeapCare.Observability

      - name: Record cross-repository commit SHAs
        shell: bash
        run: |
          set -Eeuo pipefail
          for repository in HeapCare.Local HeapCare.Api HeapCare.Web HeapCare.Observability; do
            case "$repository" in
              HeapCare.Local) checkout="$GITHUB_WORKSPACE/HeapCare.Local" ;;
              HeapCare.Api) checkout="$GITHUB_WORKSPACE/HeapCare.Api" ;;
              HeapCare.Web) checkout="$GITHUB_WORKSPACE/HeapCare.Web" ;;
              HeapCare.Observability) checkout="$GITHUB_WORKSPACE/HeapCare.Observability" ;;
            esac
            echo "===== ${repository} (HeapCare checkout: $checkout) ====="
            git -C "$checkout" rev-parse HEAD
            git -C "$checkout" log -1 --format='%H %s'
          done

      - name: Install .NET SDK for the shared observability projects
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Pack shared observability libraries into an ephemeral local NuGet feed
        working-directory: HeapCare.Observability
        run: |
          set -Eeuo pipefail
          feed="$GITHUB_WORKSPACE/HeapCare.Api/.ci-nuget"
          mkdir -p "$feed"
          dotnet pack src/HeapCare.Observability/HeapCare.Observability.csproj \
            --configuration Release -p:Version=1.0.2 -o "$feed"
          dotnet pack src/HeapCare.Observability.AspNetCore/HeapCare.Observability.AspNetCore.csproj \
            --configuration Release -p:Version=1.0.2 -o "$feed"
          test -s "$feed/HeapCare.Observability.1.0.2.nupkg"
          test -s "$feed/HeapCare.Observability.AspNetCore.1.0.2.nupkg"
          cat > "$GITHUB_WORKSPACE/HeapCare.Api/NuGet.Config" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="heapcare-ci" value=".ci-nuget" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="heapcare-ci">
                <package pattern="HeapCare.*" />
              </packageSource>
              <packageSource key="nuget.org">
                <package pattern="*" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          EOF

      - name: Prepare isolated synthetic local environment and non-credential Docker secret
        working-directory: HeapCare.Local
        shell: bash
        run: |
          set -Eeuo pipefail
          cp local/.env.example local/.env
          python3 - <<'PY'
          from pathlib import Path
          from secrets import token_hex

          path = Path("local/.env")
          values = {
              "KEYCLOAK_ADMIN_PASSWORD": token_hex(32),
              "POSTGRES_PASSWORD": token_hex(32),
              "PLATFORM_BOOTSTRAP_SECRET": token_hex(32),
          }
          lines = path.read_text(encoding="utf-8").splitlines()
          for key, value in values.items():
              lines = [
                  f"{key}={value}" if line.startswith(f"{key}=") else line
                  for line in lines
              ]
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          mkdir -p local/.secrets
          umask 077
          # The API Dockerfile always mounts this BuildKit secret. In this CI job,
          # HeapCare.* packages are restored from .ci-nuget, so no GitHub token
          # or private package credential is needed or supplied.
          printf 'Username=ci;Password=not-used;ValidAuthenticationTypes=Basic' \
            > local/.secrets/nuget-source-credentials
          echo "HEAPCARE_API_PATH=$GITHUB_WORKSPACE/HeapCare.Api" >> "$GITHUB_ENV"
          echo "HEAPCARE_WEB_PATH=$GITHUB_WORKSPACE/HeapCare.Web" >> "$GITHUB_ENV"
          echo "127.0.0.1 keycloak.localhost" | sudo tee -a /etc/hosts > /dev/null
          test -s local/.env
          test -s local/.secrets/nuget-source-credentials

      - name: Build and run the complete nine-service Compose stack
        working-directory: HeapCare.Local
        shell: bash
        run: |
          set -Eeuo pipefail
          # Keep the verifier's own docker compose calls in the same isolated
          # project context as the stack started below.
          export COMPOSE_PROJECT_NAME=heapcare-fullstack-ci
          compose=(docker compose --project-name heapcare-fullstack-ci --env-file local/.env -f local/docker-compose.yml -f local/docker-compose.observability.yml)
          "${compose[@]}" config --quiet
          "${compose[@]}" pull --ignore-buildable
          "${compose[@]}" build --pull api web
          "${compose[@]}" up -d --remove-orphans

          echo "Waiting for API, Web and Keycloak..."
          ready=false
          for attempt in $(seq 1 180); do
            if curl --silent --show-error --fail --connect-timeout 3 --max-time 10 http://localhost:8081/ >/dev/null 2>&1 \
              && curl --silent --show-error --fail --connect-timeout 3 --max-time 10 http://localhost:8080/ >/dev/null 2>&1 \
              && curl --silent --show-error --fail --connect-timeout 3 --max-time 10 \
                http://keycloak.localhost:8082/realms/compilecare/.well-known/openid-configuration >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            "${compose[@]}" ps
            "${compose[@]}" logs --no-color --tail=150
            exit 1
          fi

          echo "Reconciling the local Keycloak client..."
          python3 local/scripts/configure-keycloak.py local/.env --base-url http://keycloak.localhost:8082

          echo "Running the merged nine-service verification, including real API-to-Jaeger/Npgsql and Collector metrics checks..."
          bash local/scripts/verify-stack.sh

      - name: Verify real Keycloak-issued identities and persisted multi-tenant workflows
        working-directory: HeapCare.Local
        env:
          HEAPCARE_CI_ACCEPTANCE: "1"
          HEAPCARE_BROWSER_TEST_USER_FILE: ${{ runner.temp }}/heapcare-browser-user.json
        run: python3 local/scripts/verify-authenticated-tenancy.py

      - name: Smoke-test PostgreSQL logical backup and isolated restore
        working-directory: HeapCare.Local
        shell: bash
        run: |
          set -Eeuo pipefail
          compose=(docker compose --project-name heapcare-fullstack-ci --env-file local/.env -f local/docker-compose.yml -f local/docker-compose.observability.yml)
          backup="$RUNNER_TEMP/heapcare-postgres-ci.dump"
          container_backup="/tmp/heapcare-postgres-ci.dump"

          cleanup() {
            "${compose[@]}" exec -T postgres sh -ec 'PGPASSWORD="$POSTGRES_PASSWORD" dropdb --if-exists --username="$POSTGRES_USER" heapcare_ci_restore_verify' >/dev/null 2>&1 || true
            "${compose[@]}" exec -T postgres rm -f "$container_backup" >/dev/null 2>&1 || true
            rm -f "$backup"
          }
          trap cleanup EXIT

          echo "Creating a custom-format logical backup of the isolated CI database..."
          "${compose[@]}" exec -T postgres sh -ec \
            'PGPASSWORD="$POSTGRES_PASSWORD" pg_dump --no-owner --no-acl --format=custom --username="$POSTGRES_USER" --dbname="$POSTGRES_DB"' \
            > "$backup"
          test -s "$backup"
          pg_restore --list "$backup" > "$RUNNER_TEMP/heapcare-postgres-ci.dump-list"
          test -s "$RUNNER_TEMP/heapcare-postgres-ci.dump-list"

          echo "Creating a separate empty restore target..."
          "${compose[@]}" exec -T postgres sh -ec \
            'PGPASSWORD="$POSTGRES_PASSWORD" createdb --username="$POSTGRES_USER" --template=template0 heapcare_ci_restore_verify'
          "${compose[@]}" cp "$backup" "postgres:$container_backup"

          echo "Restoring the archive into the isolated target database..."
          "${compose[@]}" exec -T postgres sh -ec \
            'PGPASSWORD="$POSTGRES_PASSWORD" pg_restore --no-owner --no-acl --exit-on-error --username="$POSTGRES_USER" --dbname=heapcare_ci_restore_verify /tmp/heapcare-postgres-ci.dump'

          python3 - <<'PY'
          import json
          import subprocess

          compose = [
              "docker", "compose", "--project-name", "heapcare-fullstack-ci",
              "--env-file", "local/.env",
              "-f", "local/docker-compose.yml",
              "-f", "local/docker-compose.observability.yml",
          ]
          count_sql = r"""
          CREATE TEMP TABLE _heapcare_ci_row_counts (
              table_schema text NOT NULL,
              table_name text NOT NULL,
              row_count bigint NOT NULL
          );
          DO $block$
          DECLARE
              item record;
              current_count bigint;
          BEGIN
              FOR item IN
                  SELECT table_schema, table_name
                  FROM information_schema.tables
                  WHERE table_schema NOT IN ('pg_catalog', 'information_schema')
                    AND table_type = 'BASE TABLE'
                  ORDER BY table_schema, table_name
              LOOP
                  EXECUTE format(
                      'SELECT count(*) FROM %I.%I',
                      item.table_schema,
                      item.table_name
                  ) INTO current_count;
                  INSERT INTO _heapcare_ci_row_counts
                  VALUES (item.table_schema, item.table_name, current_count);
              END LOOP;
          END
          $block$;
          SELECT COALESCE(
              jsonb_object_agg(table_schema || '.' || table_name, row_count),
              '{}'::jsonb
          )
          FROM _heapcare_ci_row_counts;
          """

          def table_counts(database: str) -> dict[str, int]:
              command = compose + [
                  "exec", "-T", "postgres", "sh", "-ec",
                  'PGPASSWORD="$POSTGRES_PASSWORD" psql -v ON_ERROR_STOP=1 '
                  '-U "$POSTGRES_USER" -d "$1" -Atqc "$2"',
                  "sh", database, count_sql,
              ]
              result = subprocess.run(
                  command,
                  check=True,
                  capture_output=True,
                  text=True,
              )
              lines = [line for line in result.stdout.splitlines() if line.strip()]
              if not lines:
                  raise RuntimeError(f"PostgreSQL returned no table counts for {database}.")
              return json.loads(lines[-1])

          source = table_counts("compilecare")
          restored = table_counts("heapcare_ci_restore_verify")
          if not source:
              raise AssertionError("The source database contains no application tables to verify.")
          if source != restored:
              missing = sorted(set(source) - set(restored))
              unexpected = sorted(set(restored) - set(source))
              changed = sorted(
                  name for name in set(source) & set(restored)
                  if source[name] != restored[name]
              )
              raise AssertionError(
                  "Logical restore mismatch: "
                  f"missing_tables={missing}, unexpected_tables={unexpected}, "
                  f"row_count_mismatches={changed}"
              )

          print(
              "PostgreSQL logical backup/restore verified: "
              f"{len(source)} application tables restored with matching row counts."
          )
          PY

          echo "The isolated restore check passed. This is a logical dump/restore smoke test, not provider PITR or a production disaster-recovery drill."

      - name: Install Node.js for real browser acceptance
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run real Keycloak Authorization Code + PKCE browser acceptance on Chromium
        working-directory: HeapCare.Web
        env:
          HEAPCARE_BROWSER_TEST_USER_FILE: ${{ runner.temp }}/heapcare-browser-user.json
          PLAYWRIGHT_BROWSER: chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
          npm run test:e2e:real-oidc

      - name: Run authenticated six-role accessibility baseline on Firefox and WebKit
        working-directory: HeapCare.Web
        env:
          HEAPCARE_BROWSER_TEST_USER_FILE: ${{ runner.temp }}/heapcare-browser-user.json
        run: |
          set -Eeuo pipefail
          for browser in firefox webkit; do
            echo "Running real-Keycloak authenticated accessibility baseline on ${browser}..."
            PLAYWRIGHT_BROWSER="${browser}" npx playwright test \
              --config=playwright.real-oidc.config.ts \
              e2e-real/real-keycloak-authenticated-accessibility.spec.ts
          done

      - name: Capture full-stack diagnostics on failure
        if: failure()
        working-directory: HeapCare.Local
        run: |
          docker compose --project-name heapcare-fullstack-ci --env-file local/.env \
            -f local/docker-compose.yml -f local/docker-compose.observability.yml ps || true
          docker compose --project-name heapcare-fullstack-ci --env-file local/.env \
            -f local/docker-compose.yml -f local/docker-compose.observability.yml logs --no-color --tail=200 || true

      - name: Stop the isolated stack and remove CI-only secrets and volumes
        if: always()
        working-directory: HeapCare.Local
        run: |
          docker compose --project-name heapcare-fullstack-ci --env-file local/.env \
            -f local/docker-compose.yml -f local/docker-compose.observability.yml down --volumes --remove-orphans || true
          rm -rf local/.secrets
          rm -f local/.env
          rm -f "${RUNNER_TEMP}/heapcare-browser-user.json"
